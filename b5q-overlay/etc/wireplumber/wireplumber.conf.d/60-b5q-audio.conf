# Samsung Galaxy Z Flip 5 (SM8550-Samsung-B5Q): force ACP UCM "HiFi" profile
# (TFA9878 dual speakers + dual DMICs), overriding 52-sm8550-alsa.conf and
# 53-konkr-audio.conf's "HiFi (Headphones, Speaker)" profile name.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        api.acp.auto-profile = true
        api.acp.auto-port = true
        api.alsa.use-acp = true
        device.profile = "HiFi"
        api.alsa.soft-mixer = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.platform-*" }
    ]
    actions = {
      update-props = {
        node.create-loopback = false
      }
    }
  }
]
